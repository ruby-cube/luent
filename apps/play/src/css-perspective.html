<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>CSS 3D Floor Circle</title>
   <style>
      :root {
         --bg-top: #e6f2ff;
         --bg-bottom: #9bbad3;
         --floor-light: #7b95ad;
         --floor-dark: #5c7388;
         --disk-top: #fdfdfd;
         --disk-edge: #bfc9d4;
         --shadow: rgba(0, 0, 0, 0.35);
         --floor-pitch: 78deg;
         --floor-roll: -24deg;
         --floor-orientation: rotateZ(var(--floor-roll)) rotateX(var(--floor-pitch));
         --camera-distance: 210px;
         --camera-origin-x: 50%;
         --camera-origin-y: 10%;
         --disk-size: 90%;
      }

      * {
         box-sizing: border-box;
      }

      body {
         margin: 0;
         min-height: 100vh;
         display: grid;
         place-items: center;
         background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
         font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      .scene {
         width: min(90vw, 700px);
         height: min(70vh, 480px);
         perspective: var(--camera-distance);
         perspective-origin: var(--camera-origin-x) var(--camera-origin-y);
         position: relative;
         isolation: isolate;
      }

      .floor {
         position: absolute;
         inset: 22% 5% 0;
         transform-style: preserve-3d;
         transform: var(--floor-orientation);
         border-radius: 18px;
         background:
            radial-gradient(circle at 30% 35%, rgba(255, 255, 255, 0.28), transparent 45%),
            repeating-linear-gradient(
               90deg,
               var(--floor-light) 0 36px,
               var(--floor-dark) 36px 72px
            );
         box-shadow:
            0 30px 42px rgba(0, 0, 0, 0.18),
            inset 0 0 40px rgba(0, 0, 0, 0.2);
      }

      .disk-shadow {
         position: absolute;
         left: 50%;
         top: 61%;
         width: var(--disk-size);
         height: var(--disk-size);
         transform: translate(-50%, -50%) rotateZ(var(--floor-roll)) rotateX(var(--floor-pitch)) translateY(3px) scale(1.06);
         transform-origin: center;
         border-radius: 50%;
         background: radial-gradient(circle at 50% 55%, var(--shadow), rgba(0, 0, 0, 0.03) 72%);
         filter: blur(1px);
      }

      .circle {
         position: absolute;
         left: 50%;
         top: 61%;
         width: var(--disk-size);
         aspect-ratio: 1;
         transform: translate(-50%, -50%) rotateZ(var(--floor-roll)) rotateX(var(--floor-pitch));
         transform-origin: center;
         transform-style: preserve-3d;
         border-radius: 50%;
      }

      .circle-svg {
         position: absolute;
         inset: 0;
         width: 100%;
         height: 100%;
         display: block;
         overflow: visible;
         transform: translateZ(1px);
      }

      .disk-fill {
         fill: url(#diskSurface);
      }

      .disk-outline {
         fill: none;
         stroke: rgba(250, 254, 255, 0.98);
         stroke-width: 8;
      }

      .disk-outline-inner {
         fill: none;
         stroke: rgba(94, 110, 128, 0.38);
         stroke-width: 2;
      }
   </style>
</head>
<body>
   <main class="scene" aria-label="A circle placed on a 3D floor">
      <div class="floor"></div>
      <div class="disk-shadow"></div>
      <div class="circle">
         <svg class="circle-svg" viewBox="0 0 220 220" aria-hidden="true">
            <defs>
               <radialGradient id="diskSurface" cx="50%" cy="38%" r="62%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="60%" stop-color="#f3f6fa" />
                  <stop offset="100%" stop-color="#bfc9d4" />
               </radialGradient>
            </defs>
            <circle class="disk-fill" cx="110" cy="110" r="98" />
            <circle class="disk-outline" cx="110" cy="110" r="98" />
            <circle class="disk-outline-inner" cx="110" cy="110" r="91" />
         </svg>
      </div>
   </main>
</body>
</html>
